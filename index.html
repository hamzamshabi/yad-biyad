<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يد بيد: الكاميرا والنقاط</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0D0F12; --surf: #171A1F; --line: #262A31; --muted: #A3A9B3; --fg: #F2F3F5; --red: #E81C25; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
main { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
       padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 18px; font-weight: 700; }
nav { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surf); direction: ltr; }
nav a { min-width: 56px; height: 38px; padding: 0 12px; display: flex; align-items: center; justify-content: center; border-radius: 999px;
        color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; }
nav a[aria-current] { background: var(--fg); color: var(--bg); }
.frame { position: relative; flex: 1 1 0; min-height: 0; border-radius: 28px; background: var(--surf); overflow: hidden; }
/* The picture and the points flip together here. The video element itself keeps the raw frame, and that goes to MediaPipe. */
.stage { position: absolute; inset: 0; transform: scaleX(-1); }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#status { position: absolute; top: 14px; left: 0; right: 0; width: fit-content; max-width: calc(100% - 28px); margin: 0 auto; padding: 7px 14px;
          border-radius: 999px; background: rgba(13, 15, 18, .72); color: var(--fg); font-size: 14px; font-weight: 600; text-align: center; }
#status.bad { background: rgba(251, 191, 36, .16); color: #FDE68A; }
#status:empty { display: none; }
.stats { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { padding: 10px 12px; border-radius: 16px; background: var(--surf); }
.stats dt { color: var(--muted); font-size: 13px; }
.stats dd { margin: 2px 0 0; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; font-weight: 500; }
#info, .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
button { height: 52px; flex: none; border: 0; border-radius: 16px; background: var(--red); color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>الكاميرا والنقاط</h1>
    <nav aria-label="مكان تشغيل النموذج">
      <a id="gpu" href="?delegate=GPU&auto=1">GPU</a>
      <a id="cpu" href="?delegate=CPU&auto=1">CPU</a>
    </nav>
  </header>
  <section class="frame" aria-label="الكاميرا">
    <div class="stage">
      <video id="video" muted playsinline autoplay></video>
      <canvas id="points" aria-hidden="true"></canvas>
    </div>
    <p id="status" role="status"></p>
  </section>
  <dl class="stats">
    <div><dt>السرعة</dt><dd><span id="fps">–</span> <small>إطار/ث</small></dd></div>
    <div><dt>الإطار الواحد</dt><dd><span id="ms">–</span> <small>ms</small></dd></div>
    <div><dt>مقطع 6 ثوانٍ</dt><dd><span id="clip">–</span> <small>ث</small></dd></div>
  </dl>
  <p id="info">النقاط تتحسب داخل جهازك، وما يطلع منه شي: لا فيديو ولا نقاط.</p>
  <button id="start" type="button">شغّل الكاميرا</button>
</main>
<script src="vendor/holistic/holistic.js"></script>
<script src="camera.js"></script>
</body>
</html>
